<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Storia dell'Atomo - Home</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
  /* Reset e Font */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
}

body {
    background-color: #0a0a0c;
    color: #ffffff;
    overflow-x: hidden;
}

/* Nav Bar Moderna */
.navbar {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 20px 8%;
    background: rgba(10, 10, 12, 0.7);
    backdrop-filter: blur(10px); /* Effetto vetro sfocato */
    border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    z-index: 1000;
}

.logo {
    font-size: 24px;
    font-weight: 700;
    letter-spacing: 1px;
}

.logo span {
    color: #00f2fe; /* Tocco di colore cyan */
}

.nav-links {
    list-style: none;
    display: flex;
    gap: 30px;
}

.nav-links a {
    text-decoration: none;
    color: #a0a0a5;
    font-size: 16px;
    font-weight: 500;
    transition: color 0.3s ease;
}

.nav-links a:hover, .nav-links a.active {
    color: #00f2fe;
}

/* Hero Section */
.hero-section {
    position: relative;
    height: 100vh;
    width: 100%;
    display: flex;
    align-items: center;
    padding: 0 8%;
}

/* Il contenitore del 3D occupa tutto lo sfondo della hero */
#canvas-container {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 1;
}

/* Testi sopra l'atomo 3D */
.hero-content {
    position: relative;
    z-index: 2; /* Sopra il canvas */
    max-width: 600px;
    pointer-events: none; /* Permette di "cliccare attraverso" il testo per muovere l'atomo */
}

.hero-content h1 {
    font-size: 4rem;
    font-weight: 800;
    line-height: 1.1;
    margin-bottom: 20px;
    background: linear-gradient(45deg, #ffffff, #00f2fe);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
}

.hero-content p {
    font-size: 1.2rem;
    color: #a0a0a5;
    margin-bottom: 30px;
}

/* Bottone Interattivo */
.btn {
    pointer-events: auto; /* Riattiva i click sul bottone */
    display: inline-block;
    padding: 12px 30px;
    background: linear-gradient(45deg, #00f2fe, #4facfe);
    color: #000;
    font-weight: 600;
    text-decoration: none;
    border-radius: 50px;
    box-shadow: 0 0 20px rgba(0, 242, 254, 0.4);
    transition: transform 0.3s ease, box-shadow 0.3s ease;
}

.btn:hover {
    transform: translateY(-3px);
    box-shadow: 0 0 30px rgba(0, 242, 254, 0.7);
}
</style>
</head>
<body>

    <nav class="navbar">
        <div class="logo">Atomos<span>.</span></div>
        <ul class="nav-links">
            <li><a href="#" class="active">Home</a></li>
            <li><a href="#">Modelli Storici</a></li>
            <li><a href="#">Cronologia</a></li>
            <li><a href="#">Scienziati</a></li>
        </ul>
    </nav>

    <header class="hero-section">
        <div id="canvas-container"></div>
        
        <div class="hero-content">
            <h1>La Storia dell'Atomo</h1>
            <p>Un viaggio nel tempo dall'indivisibile di Democrito alla meccanica quantistica.</p>
            <a href="#" class="btn">Esplora la Storia</a>
        </div>
    </header>

    <script>
// =========================================================================
// CONFIGURAZIONE SCENA, TELECAMERA E RENDERIZZATORE
// =========================================================================
const container = document.getElementById('canvas-container');
const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
camera.position.z = 10; 

const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
container.appendChild(renderer.domElement);

// Gruppo principale che conterrà tutto l'atomo (permettendo la rotazione con il mouse)
const atomGroup = new THREE.Group();
scene.add(atomGroup);

// =========================================================================
// 1. ILLUMINAZIONE (Necessaria per dare volume 3D)
// =========================================================================
const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
scene.add(ambientLight);

const dirLight1 = new THREE.DirectionalLight(0x00f2fe, 1.5);
dirLight1.position.set(5, 5, 5);
scene.add(dirLight1);

const dirLight2 = new THREE.DirectionalLight(0xff00ff, 1);
dirLight2.position.set(-5, -5, 3);
scene.add(dirLight2);

// =========================================================================
// 2. IL NUCLEO COPOSTO (Protoni e Neutroni)
// =========================================================================
const nucleusGroup = new THREE.Group();
atomGroup.add(nucleusGroup);

const sphereGeo = new THREE.SphereGeometry(0.3, 16, 16);
const protonMat = new THREE.MeshPhongMaterial({ color: 0xff007f, shininess: 100 });
const neutronMat = new THREE.MeshPhongMaterial({ color: 0x007fff, shininess: 100 });

// Generiamo un agglomerato di sferette per fare un vero nucleo
const particleCount = 12;
for (let i = 0; i < particleCount; i++) {
    const isProton = i % 2 === 0;
    const mesh = new THREE.Mesh(sphereGeo, isProton ? protonMat : neutronMat);
    
    // Posiziona le sferette vicine al centro in modo casuale
    mesh.position.set(
        (Math.random() - 0.5) * 0.6,
        (Math.random() - 0.5) * 0.6,
        (Math.random() - 0.5) * 0.6
    );
    nucleusGroup.add(mesh);
}

// =========================================================================
// 3. ORBITE ED ELETRONI
// =========================================================================
const orbitsData = [
    { radius: 3.5, tiltX: 0.5, tiltY: 0.8, speed: 2.5, color: 0x00f2fe },
    { radius: 4.2, tiltX: -0.6, tiltY: -0.4, speed: 1.8, color: 0x00f2fe },
    { radius: 4.8, tiltX: 0.2, tiltY: -0.9, speed: 3.0, color: 0x00f2fe }
];

const electrons = [];
const orbitLines = [];

orbitsData.forEach(data => {
    // Creazione anello dell'orbita
    const orbitGeo = new THREE.RingGeometry(data.radius, data.radius + 0.03, 64);
    const orbitMat = new THREE.MeshBasicMaterial({ 
        color: 0xffffff, 
        side: THREE.DoubleSide,
        transparent: true,
        opacity: 0.15
    });
    const orbit = new THREE.Mesh(orbitGeo, orbitMat);
    
    // Applica inclinazione dell'orbita
    orbit.rotation.x = data.tiltX;
    orbit.rotation.y = data.tiltY;
    atomGroup.add(orbit);
    orbitLines.push(orbit);

    // Creazione Elettrone (Sfera luminosa)
    const electronGeo = new THREE.SphereGeometry(0.15, 16, 16);
    const electronMat = new THREE.MeshPhongMaterial({ 
        color: 0x00f2fe, 
        emissive: 0x00f2fe,
        emissiveIntensity: 0.8 
    });
    const electron = new THREE.Mesh(electronGeo, electronMat);
    atomGroup.add(electron);

    // Salviamo i dati per muoverli nell'animate loop
    electrons.push({
        mesh: electron,
        radius: data.radius,
        tiltX: data.tiltX,
        tiltY: data.tiltY,
        speed: data.speed,
        angle: Math.random() * Math.PI * 2 // Partenza casuale
    });
});

// =========================================================================
// 4. INTERATTIVITÀ MOUSE (Effetto Parallasse)
// =========================================================================
let mouseX = 0;
let mouseY = 0;
let targetX = 0;
let targetY = 0;

window.addEventListener('mousemove', (event) => {
    // Normalizza le coordinate del mouse (-1 a 1)
    mouseX = (event.clientX / window.innerWidth) * 2 - 1;
    mouseY = -(event.clientY / window.innerHeight) * 2 + 1;
});

// =========================================================================
// 5. LOOP DI ANIMAZIONE
// =========================================================================
const clock = new THREE.Clock();

function animate() {
    requestAnimationFrame(animate);
    const delta = clock.getDelta();
    const elapsedTime = clock.getElapsedTime();

    // 1. Fai vibrare leggermente il nucleo per dare energia
    nucleusGroup.rotation.x += 0.01;
    nucleusGroup.rotation.y += 0.01;
    nucleusGroup.children.forEach((child, index) => {
        child.position.x += Math.sin(elapsedTime * 5 + index) * 0.002;
        child.position.y += Math.cos(elapsedTime * 5 + index) * 0.002;
    });

    // 2. Muovi gli elettroni lungo le loro orbite inclinate
    electrons.forEach(el => {
        el.angle += el.speed * delta; // Avanzamento basato sul tempo reale

        // Calcolo posizione 2D sull'orbita piatta
        let x = Math.cos(el.angle) * el.radius;
        let y = Math.sin(el.angle) * el.radius;
        let z = 0;

        // Creiamo un vettore 3D e applichiamo le stesse rotazioni dell'orbita madre
        const pos = new THREE.Vector3(x, y, z);
        pos.applyAxisAngle(new THREE.Vector3(1, 0, 0), el.tiltX);
        pos.applyAxisAngle(new THREE.Vector3(0, 1, 0), el.tiltY);

        el.mesh.position.copy(pos);
    });

    // 3. Rotazione fluida dell'intero atomo in base al mouse
    targetX = mouseX * 0.5;
    targetY = mouseY * 0.5;

    atomGroup.rotation.y += (targetX - atomGroup.rotation.y) * 0.05;
    atomGroup.rotation.x += (targetY - atomGroup.rotation.x) * 0.05;

    // Rotazione automatica di sottofondo costante minima
    atomGroup.rotation.y += 0.002;

    renderer.render(scene, camera);
}

animate();

// =========================================================================
// 6. GESTIONE RESPONSIVE
// =========================================================================
window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
});
    </script>
</body>
</html>
