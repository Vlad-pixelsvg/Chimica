<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Storia dell'Atomo - Home</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<body>
<div id="canvas-container" style="width: 100vw; height: 100vh; background: #0a0a0c;"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>
// =========================================================================
// CONFIGURAZIONE SCENA, TELECAMERA E RENDERIZZATORE
// =========================================================================
const container = document.getElementById('canvas-container');
const scene = new THREE.Scene();

// Allarghiamo la telecamera e la allontaniamo per far stare i 3 modelli affiancati
const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
camera.position.set(0, 0, 12); 

const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
container.appendChild(renderer.domElement);

// Gruppo globale per la rotazione interattiva con il mouse
const globalGroup = new THREE.Group();
scene.add(globalGroup);

// Luci necessarie per i nuclei e i materiali Phong
const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
scene.add(ambientLight);

const dirLight = new THREE.DirectionalLight(0x00f2fe, 1.5);
dirLight.position.set(0, 10, 10);
scene.add(dirLight);


// =========================================================================
// TRUCCO SHADER: Funzione per creare il materiale a CERCHI SFOCATI PERFETTI
// =========================================================================
function createCircleParticleMaterial(color, size, opacity) {
    const mat = new THREE.PointsMaterial({
        color: color,
        size: size,
        transparent: true,
        opacity: opacity,
        blending: THREE.AdditiveBlending,
        depthWrite: false
    });
    mat.onBeforeCompile = (shader) => {
        shader.fragmentShader = shader.fragmentShader.replace(
            'void main() {',
            `void main() {
             vec2 coord = gl_PointCoord - vec2(0.5);
             float dist = length(coord);
             if (dist > 0.5) discard;
             float alpha = smoothstep(0.5, 0.1, dist);`
        );
        shader.fragmentShader = shader.fragmentShader.replace(
            'gl_FragColor = vec4( diffuse, opacity );',
            'gl_FragColor = vec4( diffuse, opacity * alpha );'
        );
    };
    return mat;
}


// =========================================================================
// -------------------------------------------------------------------------
// NOTA - MODELLO 1: ONDE CONCENTRICHE MATEMATICHE (A SINISTRA)
// -------------------------------------------------------------------------
// =========================================================================
const model1Group = new THREE.Group();
model1Group.position.x = -6; // Spostato a sinistra
globalGroup.add(model1Group);

// Nucleo del Modello 1
const n1Geo = new THREE.IcosahedronGeometry(0.25, 2);
const n1Mat = new THREE.MeshPhongMaterial({ color: 0xff00ff });
const nucleus1 = new THREE.Mesh(n1Geo, n1Mat);
model1Group.add(nucleus1);

const waveCount = 3;
const wavesM1 = [];
for (let i = 0; i < waveCount; i++) {
    const geo = new THREE.SphereGeometry(0.8 + i * 0.6, 32, 32);
    const mat = new THREE.MeshBasicMaterial({
        color: i % 2 === 0 ? 0x00f2fe : 0x7209b7,
        transparent: true,
        opacity: 0.15,
        wireframe: true,
        blending: THREE.AdditiveBlending,
        side: THREE.DoubleSide
    });
    const mesh = new THREE.Mesh(geo, mat);
    model1Group.add(mesh);
    wavesM1.push({ mesh, phase: i * Math.PI / 2 });
}


// =========================================================================
// -------------------------------------------------------------------------
// NOTA - MODELLO 2: NUVOLA DI PROBABILITÀ A CERCHI (AL CENTRO)
// -------------------------------------------------------------------------
// =========================================================================
const model2Group = new THREE.Group();
model2Group.position.x = 0; // Al centro perfetto
globalGroup.add(model2Group);

// Nucleo del Modello 2
const n2Group = new THREE.Group();
model2Group.add(n2Group);
const sGeo = new THREE.SphereGeometry(0.12, 16, 16);
const pMat = new THREE.MeshPhongMaterial({ color: 0xff00ff });
const nMat = new THREE.MeshPhongMaterial({ color: 0x007fff });
for (let i = 0; i < 8; i++) {
    const m = new THREE.Mesh(sGeo, i % 2 === 0 ? pMat : nMat);
    m.position.set((Math.random()-0.5)*0.2, (Math.random()-0.5)*0.2, (Math.random()-0.5)*0.2);
    n2Group.add(m);
}

// Nuvola probabilistica (Schrödinger particellare con cerchi sfocati)
const particleCount = 1500;
const m2Geometry = new THREE.BufferGeometry();
const m2Positions = new Float32Array(particleCount * 3);
for (let i = 0; i < particleCount; i++) {
    const theta = Math.random() * Math.PI * 2;
    const phi = Math.acos((Math.random() * 2) - 1);
    const r = Math.pow(Math.random(), 2.5) * 2.2 + 0.1; // compresso per stare nello spazio affiancato
    m2Positions[i * 3] = r * Math.sin(phi) * Math.cos(theta);
    m2Positions[i * 3 + 1] = r * Math.sin(phi) * Math.sin(theta);
    m2Positions[i * 3 + 2] = r * Math.cos(phi);
}
m2Geometry.setAttribute('position', new THREE.BufferAttribute(m2Positions, 3));
const m2Material = createCircleParticleMaterial(0x00f2fe, 0.12, 0.7);
const pointCloud = new THREE.Points(m2Geometry, m2Material);
model2Group.add(pointCloud);


// =========================================================================
// -------------------------------------------------------------------------
// NOTA - MODELLO 3: ORBITE SINUSOIDALI A CERCHI (A DESTRA)
// -------------------------------------------------------------------------
// =========================================================================
const model3Group = new THREE.Group();
model3Group.position.x = 6; // Spostato a destra
globalGroup.add(model3Group);

// Nucleo del Modello 3
const n3Group = new THREE.Group();
model3Group.add(n3Group);
for (let i = 0; i < 8; i++) {
    const m = new THREE.Mesh(sGeo, i % 2 === 0 ? pMat : nMat);
    m.position.set((Math.random()-0.5)*0.2, (Math.random()-0.5)*0.2, (Math.random()-0.5)*0.2);
    n3Group.add(m);
}

// Funzione di supporto locale per generare l'anello ad onda sinusoidale di cerchietti
const createWaveOrbit = (radius, frequency, amplitude, color) => {
    const pCount = 180;
    const geo = new THREE.BufferGeometry();
    const pos = new Float32Array(pCount * 3);
    for (let i = 0; i < pCount; i++) {
        const theta = (i / pCount) * Math.PI * 2;
        const r = radius + Math.sin(theta * frequency) * amplitude;
        pos[i * 3] = Math.cos(theta) * r;
        pos[i * 3 + 1] = Math.sin(theta) * r;
        pos[i * 3 + 2] = Math.cos(theta * frequency) * amplitude;
    }
    geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    const mat = createCircleParticleMaterial(color, 0.1, 0.6);
    return new THREE.Points(geo, mat);
};

const o1 = createWaveOrbit(1.5, 6, 0.15, 0x00f2fe); o1.rotation.x = 0.6;
const o2 = createWaveOrbit(1.8, 8, 0.20, 0x7209b7); o2.rotation.y = 1.2;
const o3 = createWaveOrbit(2.1, 5, 0.25, 0xff00ff); o3.rotation.z = 0.8;
model3Group.add(o1, o2, o3);


// =========================================================================
// INTERATTIVITÀ MOUSE (Parallasse globale)
// =========================================================================
let mouseX = 0, mouseY = 0;
window.addEventListener('mousemove', (e) => {
    mouseX = (e.clientX / window.innerWidth) * 2 - 1;
    mouseY = -(e.clientY / window.innerHeight) * 2 + 1;
});


// =========================================================================
// LOOP DI ANIMAZIONE UNIFICATO
// =========================================================================
const clock = new THREE.Clock();

function animate() {
    requestAnimationFrame(animate);
    const time = clock.getElapsedTime();

    // --- Animazione Modello 1 ---
    nucleus1.rotation.y = time * 0.5;
    wavesM1.forEach((w, i) => {
        const scaleFactor = 1 + Math.sin(time * 2.0 + w.phase) * 0.12;
        w.mesh.scale.set(scaleFactor, scaleFactor, scaleFactor);
    });

    // --- Animazione Modello 2 ---
    n2Group.rotation.x = Math.sin(time) * 0.1;
    pointCloud.rotation.y = time * 0.05;

    // --- Animazione Modello 3 ---
    n3Group.rotation.y = time * 0.5;
    o1.rotation.z = time * 0.08;
    o2.rotation.x = time * 0.12;
    o3.rotation.y = -time * 0.06;

    // --- Rotazione di controllo tramite Mouse (Applica a tutto il gruppo)
    globalGroup.rotation.y += (mouseX * 0.4 - globalGroup.rotation.y) * 0.05;
    globalGroup.rotation.x += (mouseY * 0.3 - globalGroup.rotation.x) * 0.05;

    renderer.render(scene, camera);
}
animate();


// =========================================================================
// GESTIONE RESPONSIVE
// =========================================================================
window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</head>
</html>
